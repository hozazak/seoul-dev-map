<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 도시계획사업 지도 (서울도시공간포털)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="controls">
  <input type="text" id="search" placeholder="사업명, 자치구 검색..."/>
  <div id="counter">전체 2906건 표시 중</div>
</div>
<button id="legend-toggle" onclick="document.getElementById('legend').classList.remove('collapsed');this.style.display='none'">☰ 필터</button>
<div id="legend">  <button id="legend-close" onclick="this.parentElement.classList.add('collapsed');document.getElementById('legend-toggle').style.display='block'">✕</button>
  <div class="filter-section">
    <div class="color-mode-toggle">
      <button class="color-mode-btn active" data-mode="type">사업유형</button>
      <button class="color-mode-btn" data-mode="stage">진행단계</button>
    </div>
    <button id="restore-hidden" class="restore-hidden-btn">숨긴 필지 복원</button>
    <div id="hidden-list-wrap">
      <div id="hidden-list"></div>
    </div>
    <div id="detail-panel"></div>
  </div>
  <div class="filter-section">
    <h4>사업유형</h4>
    <label class="filter-check master-check">
      <input type="checkbox" id="type-all" checked>
      <span>전체선택</span>
    </label>
    <div id="type-filters" class="type-filters"></div>
  </div>

  <div class="filter-section">
    <h4>진행단계</h4>
    <label class="filter-check master-check">
      <input type="checkbox" id="stage-all" checked>
      <span>전체선택</span>
    </label>
    <div id="stage-filters" class="simple-filter-list"></div>
  </div>

  <div class="filter-section">
    <h4>면적</h4>
    <div class="area-filter">
      <div class="area-slider-row">
        <span style="font-size:12px">최소</span>
        <input type="range" id="area-min" min="0" max="500000" step="1000" value="0">
        <input type="number" id="area-min-input" class="area-input" min="0" max="500000" step="100" value="0" placeholder="㎡">㎡
      </div>
      <div class="area-slider-row">
        <span style="font-size:12px">최대</span>
        <input type="range" id="area-max" min="0" max="500000" step="1000" value="500000">
        <input type="number" id="area-max-input" class="area-input" min="0" max="500000" step="100" value="500000" placeholder="㎡">㎡
      </div>
      <div class="area-presets">
        <button class="area-preset-btn active" data-min="0" data-max="500000">전체</button>
        <button class="area-preset-btn" data-min="0" data-max="5000">~5천㎡</button>
        <button class="area-preset-btn" data-min="5000" data-max="10000">5천~1만</button>
        <button class="area-preset-btn" data-min="10000" data-max="50000">1만~5만</button>
        <button class="area-preset-btn" data-min="50000" data-max="100000">5만~10만</button>
        <button class="area-preset-btn" data-min="100000" data-max="500000">10만+</button>
      </div>
    </div>
  </div>

  <div class="filter-section">
    <h4>도시계획구역</h4>
    <div class="plan-zone-toggle">
      <label>
        <input type="checkbox" id="toggle-district-plan">
        <span class="zone-swatch district"></span>
        <span>지구단위계획구역 <small style="color:var(--text-muted)">(1,022)</small></span>
      </label>
      <label>
        <input type="checkbox" id="toggle-special-plan">
        <span class="zone-swatch special"></span>
        <span>특별계획구역 <small style="color:var(--text-muted)">(896)</small></span>
      </label>
    </div>
  </div>

  <div class="filter-section">
    <h4>자치구</h4>
    <label class="filter-check master-check">
      <input type="checkbox" id="gu-all" checked>
      <span>전체선택</span>
    </label>
    <div id="gu-filters" class="gu-grid"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/plans.js"></script>
</body>
</html>
